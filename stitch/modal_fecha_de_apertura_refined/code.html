<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Fecha de apertura - Modal</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "inverse-surface": "#303033",
                      "surface-container-low": "#f5f3f6",
                      "surface-bright": "#fbf8fc",
                      "on-tertiary-fixed": "#181c1d",
                      "surface-container-high": "#e9e7eb",
                      "on-surface": "#1b1b1e",
                      "on-primary": "#ffffff",
                      "on-primary-container": "#7384a9",
                      "on-tertiary": "#ffffff",
                      "inverse-primary": "#b6c6ef",
                      "surface-dim": "#dbd9dd",
                      "secondary-container": "#7bbeff",
                      "on-tertiary-container": "#818485",
                      "on-surface-variant": "#44474e",
                      "tertiary-fixed-dim": "#c4c7c8",
                      "tertiary": "#000000",
                      "primary": "#000000",
                      "secondary": "#01629d",
                      "primary-fixed-dim": "#b6c6ef",
                      "surface-variant": "#e4e2e5",
                      "primary-container": "#081b3b",
                      "on-primary-fixed-variant": "#364669",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#e0e3e4",
                      "secondary-fixed": "#cfe5ff",
                      "surface-tint": "#4e5e82",
                      "on-error-container": "#93000a",
                      "on-secondary": "#ffffff",
                      "background": "#fbf8fc",
                      "on-secondary-fixed": "#001d34",
                      "error": "#ba1a1a",
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#081b3b",
                      "secondary-fixed-dim": "#99cbff",
                      "on-background": "#1b1b1e",
                      "surface-container-highest": "#e4e2e5",
                      "on-secondary-container": "#004c7c",
                      "on-error": "#ffffff",
                      "on-secondary-fixed-variant": "#004a78",
                      "surface": "#fbf8fc",
                      "primary-fixed": "#d8e2ff",
                      "outline": "#75777f",
                      "inverse-on-surface": "#f2f0f3",
                      "on-tertiary-fixed-variant": "#434748",
                      "surface-container": "#e5eeff",
                      "outline-variant": "#c5c6cf",
                      "tertiary-container": "#181c1d"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "md": "16px",
                      "3xl": "64px",
                      "margin-mobile": "16px",
                      "lg": "24px",
                      "xl": "32px",
                      "2xl": "48px",
                      "margin-desktop": "32px",
                      "gutter": "16px",
                      "base": "4px",
                      "xs": "8px",
                      "sm": "12px"
              },
              "fontFamily": {
                      "label-md": ["Inter"],
                      "body-sm": ["Inter"],
                      "display-lg": ["Inter"],
                      "headline-md": ["Inter"],
                      "data-lg": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "headline-lg": ["Inter"],
                      "body-lg": ["Inter"],
                      "body-md": ["Inter"]
              },
              "fontSize": {
                      "label-md": ["14px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],

                      "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "data-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                      "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                      "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

</head>
<body class="bg-background text-on-background font-body-md antialiased h-screen w-screen overflow-hidden flex items-center justify-center relative">
<!-- Background to show context (optional, simulating app behind modal) -->
<div class="absolute inset-0 bg-surface-container p-xl flex flex-col gap-lg opacity-30 pointer-events-none">
<div class="h-16 bg-surface-container-lowest rounded-lg border border-outline-variant w-full"></div>
<div class="flex gap-lg flex-1">
<div class="w-64 bg-surface-container-lowest rounded-lg border border-outline-variant h-full"></div>
<div class="flex-1 bg-surface-container-lowest rounded-lg border border-outline-variant h-full"></div>
</div>
</div>
<!-- Modal Overlay -->
<div class="absolute inset-0 bg-[rgba(0,0,0,0.6)] z-40 flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Modal Card -->
<div class="bg-surface-container-lowest w-full max-w-sm rounded-lg border border-outline-variant shadow-lg flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
<!-- Header -->
<div class="flex items-center justify-between p-md border-b border-outline-variant">
<h2 class="font-headline-md text-headline-md text-on-surface">Fecha de apertura</h2>
<button aria-label="Cerrar modal" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-low p-xs rounded-full transition-colors flex items-center justify-center">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
</div>
<!-- Content -->
<div class="p-md flex flex-col gap-lg">
<!-- Quick Chips -->
<div class="flex flex-wrap gap-xs">
<button class="px-sm py-xs rounded-full border border-outline bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">
                        Hoy
                    </button>
<button class="px-sm py-xs rounded-full border border-secondary-container bg-secondary-container text-on-secondary-container font-label-md text-label-md transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check</span>
                        Hace 7 días
                    </button>
<button class="px-sm py-xs rounded-full border border-outline bg-surface-container-lowest text-on-surface font-label-md text-label-md hover:bg-surface-container-low transition-colors">
                        Hace 30 días
                    </button>
</div>
<!-- Date Input -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="fecha-apertura">Seleccionar fecha</label>
<div class="relative">
<input class="w-full bg-surface-container-low border border-error text-on-surface font-body-md text-body-md rounded px-sm py-sm focus:outline-none focus:ring-2 focus:ring-error focus:border-error transition-shadow h-[48px]" id="fecha-apertura" name="fecha-apertura" type="date" value="2023-05-11"/>
</div>
<!-- Validation Alert -->
<div class="flex items-start gap-xs mt-base text-error">
<span class="material-symbols-outlined text-[16px] mt-0.5" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-sm text-body-sm">La fecha no puede ser futura.</p>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="flex items-center justify-end gap-sm p-md border-t border-outline-variant bg-surface-bright">
<button class="px-md py-sm rounded text-primary font-label-md text-label-md hover:bg-surface-container transition-colors">
                    Cancelar
                </button>
<button class="px-md py-sm rounded bg-primary text-on-primary font-label-md text-label-md hover:opacity-90 transition-opacity">
                    Confirmar
                </button>
</div>
</div>
</div>
<style>
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        
        /* Custom styling for native date input to match design system */
        input[type="date"]::-webkit-calendar-picker-indicator {
            color: rgba(68, 71, 78, 1); /* on-surface-variant */
            cursor: pointer;
            opacity: 0.8;
            transition: opacity 0.2s;
        }
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }
    </style>
</body></html>
