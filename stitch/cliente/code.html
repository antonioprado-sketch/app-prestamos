<!-- Interactive Logic -->
<script>
        const weeklyDates = [
            { day: 'Mon', date: 'Oct 9', full: '2023-10-09' },
            { day: 'Fri', date: 'Oct 13', full: '2023-10-13' },
            { day: 'Mon', date: 'Oct 16', full: '2023-10-16' },
            { day: 'Fri', date: 'Oct 20', full: '2023-10-20' },
            { day: 'Mon', date: 'Oct 23', full: '2023-10-23' }
        ];

        const biweeklyDates = [
            { day: 'Sun', date: 'Oct 15', full: '2023-10-15' },
            { day: 'Tue', date: 'Oct 31', full: '2023-10-31' },
            { day: 'Wed', date: 'Nov 15', full: '2023-11-15' },
            { day: 'Thu', date: 'Nov 30', full: '2023-11-30' }
        ];

        let selectedDateFull = weeklyDates[0].full;

        function renderDates(type) {
            const container = document.getElementById('date-container');
            container.innerHTML = '';
            const datesToUse = type === 'weekly' ? weeklyDates : biweeklyDates;
            
            // Set default selection when switching
            selectedDateFull = datesToUse[0].full;

            datesToUse.forEach((d, index) => {
                const isSelected = selectedDateFull === d.full;
                
                const btn = document.createElement('button');
                btn.className = `flex-shrink-0 w-[88px] h-[100px] rounded-xl flex flex-col items-center justify-center gap-1 transition-all snap-start shadow-[0px_4px_20px_rgba(26,43,76,0.05)] border-2 ${isSelected ? 'bg-surface-container-lowest border-secondary' : 'bg-surface-container-lowest border-transparent hover:border-outline-variant text-on-surface-variant'}`;
                
                btn.onclick = () => selectDate(d.full, type);
                
                btn.innerHTML = `
                    <span class="font-body-sm text-body-sm ${isSelected ? 'text-secondary' : 'text-outline'}">${d.day}</span>
                    <span class="font-headline-md text-headline-md ${isSelected ? 'text-primary' : 'text-on-surface'}">${d.date.split(' ')[1]}</span>
                    <span class="font-body-sm text-body-sm ${isSelected ? 'text-primary' : 'text-outline'}">${d.date.split(' ')[0]}</span>
                `;
                container.appendChild(btn);
            });
        }

        function selectDate(fullDate, type) {
            selectedDateFull = fullDate;
            renderDates(type);
        }

        function setFrequency(type) {
            const tabWeekly = document.getElementById('tab-weekly');
            const tabBiweekly = document.getElementById('tab-biweekly');
            const labelConstraint = document.getElementById('date-constraint-label');
            const estPayment = document.getElementById('est-payment');
            const estDuration = document.getElementById('est-duration');

            // Reset styles
            tabWeekly.className = "flex-1 py-3 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container";
            tabBiweekly.className = "flex-1 py-3 text-center rounded-lg font-label-md text-label-md transition-all duration-200 text-on-surface-variant hover:bg-surface-container";

            if (type === 'weekly') {
                tabWeekly.className = "flex-1 py-3 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-secondary-container text-on-secondary-container";
                labelConstraint.innerText = "Mon / Fri only";
                estPayment.innerText = "$125.00";
                estDuration.innerText = "40 Weeks";
            } else {
                tabBiweekly.className = "flex-1 py-3 text-center rounded-lg font-label-md text-label-md transition-all duration-200 bg-secondary-container text-on-secondary-container";
                labelConstraint.innerText = "15th / End of month";
                estPayment.innerText = "$250.00";
                estDuration.innerText = "20 Bi-weeks";
            }

            renderDates(type);
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            renderDates('weekly');
        });
    </script>
