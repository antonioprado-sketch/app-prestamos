gzip on;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss image/svg+xml;
gzip_min_length 1024;

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        client_max_body_size 50m;
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # Verificada en modo Report-Only contra el stack real (mapa Leaflet,
        # detección facial MediaPipe) sin violaciones — ver project_state.md
        # (Fase 7) para el detalle de qué se probó antes de pasar a bloqueo.
        # TODO Fase 8: agregar "upgrade-insecure-requests" recién cuando TLS esté activo.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org; media-src 'self' blob:; connect-src 'self' https://storage.googleapis.com https://cdn.jsdelivr.net; worker-src 'self' blob: https://cdn.jsdelivr.net; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; manifest-src 'self'" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=(), payment=(), usb=()" always;
    }

    # TODO Fase 8: habilitar TLS (certificados Let's Encrypt) aquí.
    # listen 443 ssl;
    # ssl_certificate /etc/letsencrypt/live/appprestamos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/appprestamos.com/privkey.pem;
    # server_name appprestamos.com;
    # redirect http -> https:
    # listen 80; return 301 https://$host$request_uri;
}
