name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: appprestamos
          MYSQL_USER: prestamos
          MYSQL_PASSWORD: prestamos
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u root -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: mysql://prestamos:prestamos@localhost:3306/appprestamos
      JWT_ACCESS_SECRET: test-access
      JWT_REFRESH_SECRET: test-refresh
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: 30
      ADMIN_PHONE: admin
      ADMIN_PASSWORD: admin
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_PUBLIC_ENDPOINT: localhost
      MINIO_PUBLIC_PORT: '9000'
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
      MINIO_BUCKET: documentos
      EMAIL_ENCRYPTION_KEY: test-email-encryption-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Levantar MinIO (los e2e de documentos/video lo necesitan)
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin123 \
            minio/minio server /data
          for i in $(seq 1 15); do
            curl -sf http://localhost:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO no respondió a tiempo"; exit 1
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Lint
        working-directory: api
        run: npm run lint
      - name: Build
        working-directory: api
        run: npm run build
      - name: Apply migrations
        working-directory: api
        run: npx prisma migrate deploy
      - name: Unit tests
        working-directory: api
        run: npx jest --runInBand
      - name: E2E tests
        working-directory: api
        run: npx jest --config ./test/jest-e2e.json --runInBand

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Unit tests
        working-directory: web
        run: npm test
      - name: Build
        working-directory: web
        run: npm run build

  e2e-browser:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Escribir .env para el stack de dev
        run: |
          cat <<'EOF' > .env
          MYSQL_DATABASE=appprestamos
          MYSQL_USER=prestamos
          MYSQL_PASSWORD=prestamos
          MYSQL_ROOT_PASSWORD=root
          DATABASE_URL=mysql://prestamos:prestamos@mysql:3306/appprestamos
          API_PORT=3000
          JWT_ACCESS_SECRET=test-access
          JWT_REFRESH_SECRET=test-refresh
          JWT_ACCESS_TTL=15m
          JWT_REFRESH_TTL_DAYS=30
          ADMIN_PHONE=admin
          ADMIN_PASSWORD=admin
          TZ=America/Mexico_City
          GMAIL_USER=
          GMAIL_APP_PASSWORD=
          EMAIL_ENCRYPTION_KEY=test-email-encryption-key
          VAPID_PUBLIC_KEY=
          VAPID_PRIVATE_KEY=
          VAPID_SUBJECT=mailto:admin@example.com
          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin123
          MINIO_BUCKET=documentos
          MINIO_PUBLIC_ENDPOINT=localhost
          MINIO_PUBLIC_PORT=9000
          EOF
      - name: Build frontend (Nginx sirve web/dist como archivos estáticos)
        working-directory: web
        run: npm ci && npm run build
      - name: Levantar stack Docker real
        run: docker compose -f docker-compose.dev.yml up -d --build mysql minio api nginx
      - name: Esperar a que la API esté lista
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost/api/v1/health/ready && exit 0
            sleep 2
          done
          echo "La API no respondió a tiempo"; exit 1
      - name: Aplicar migraciones de Prisma
        working-directory: api
        env:
          DATABASE_URL: mysql://prestamos:prestamos@localhost:3307/appprestamos
        run: npm ci && npx prisma migrate deploy
      - name: Instalar Playwright + Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Correr e2e de navegador real
        working-directory: web
        run: npm run test:e2e
      - name: Subir reporte de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
      - name: Apagar el stack
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v
